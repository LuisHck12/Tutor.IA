<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor IA Studio Pro + Groq</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    @keyframes pulse-orb {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 25px rgba(14, 165, 233, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
    }
    .voice-orb { background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7, #0369a1); animation: pulse-orb 2s infinite ease-in-out; }
    .voice-orb.speaking { background: radial-gradient(circle at 30% 30%, #4ade80, #22c55e, #15803d); animation: pulse-orb 0.8s infinite ease-in-out; }
    .voice-orb.listening { background: radial-gradient(circle at 30% 30%, #f43f5e, #e11d48, #9f1239); animation: pulse-orb 1.2s infinite ease-in-out; }
    .prose img { border-radius: 12px; margin-top: 10px; width: 100%; max-width: 800px; height: auto; object-fit: contain; display: block; margin-left: auto; margin-right: auto; }
    .prose pre { background: #1d1f21 !important; border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body.dark { background-color: #0f172a; color: #f1f5f9; }
    .dark .bg-white { background-color: #1e293b; color: #f1f5f9; }
    .dark .bg-gray-50 { background-color: #0f172a; }
    .dark .text-gray-800 { color: #f8fafc; }
    .dark .border-gray-200 { border-color: #334155; }
    .dark .prose { color: #e2e8f0; }
    .dark footer { background: linear-gradient(to top, #0f172a, rgba(15, 23, 42, 0.9), transparent) !important; }
    .prose img { background: white; padding: 8px; border: 1px solid #e2e8f0; }
    .dark .prose img { background: #1e293b; border-color: #334155; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-full flex font-sans overflow-hidden transition-colors duration-300">

  <!-- BARRA LATERAL -->
  <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex shrink-0 z-40">
    <div class="p-4 border-b border-gray-800">
      <div class="flex items-center gap-2 mb-4 px-2">
        <span class="bg-orange-600 p-2 rounded-lg text-xs">👤</span>
        <span id="user-display-name" class="font-medium text-sm truncate">Hosda</span>
      </div>
      <button onclick="createNewChat()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 px-4 rounded-xl flex justify-center gap-2 text-sm font-bold mb-2">+ Nuevo Chat</button>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-1" id="history-list"></div>
    <div class="p-4 border-t border-gray-800 space-y-2">
      <button onclick="toggleGlossaryModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">📖 Glosario</button>
      <button onclick="toggleMemoryModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">🧠 Memoria Activa</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 flex flex-col h-full relative bg-white">
    
    <header class="h-14 border-b border-gray-200 flex items-center justify-between px-4 shadow-sm z-10 bg-white">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <h1 class="font-bold text-gray-700 text-sm hidden sm:block">Tutor IA Groq Pro</h1>
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <button onclick="exportChatTXT()" class="text-gray-500 hover:text-green-600 transition-colors text-xs font-medium px-2 py-1 rounded bg-gray-100">📥 Exportar</button>
        <button onclick="toggleTheme()" id="theme-btn" class="text-gray-500 hover:text-yellow-500 transition-colors text-sm font-medium">🌙</button>
        <button onclick="toggleContinuousMode()" id="continuous-btn" class="text-gray-400 hover:text-green-600 transition-all text-sm font-medium flex items-center gap-1">📞 Llamada</button>
        <button onclick="toggleAudio()" class="text-gray-500 hover:text-orange-600 transition-colors text-sm font-medium flex items-center gap-1"><span id="audio-icon">🔊</span></button>
        <button onclick="toggleSettings()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">⚙️ Ajustes</button>
      </div>
    </header>

    <!-- BIBLIOTECA -->
    <nav class="border-b border-gray-100 bg-gray-50 p-2 flex overflow-x-auto no-scrollbar gap-2 z-10 shadow-inner">
      <span class="text-xs font-bold text-gray-400 py-1.5 px-2 uppercase tracking-wider shrink-0">Biblioteca:</span>
      <button onclick="setTutor('math')" class="shrink-0 bg-white border border-gray-200 hover:border-orange-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">📐 Matemáticas</button>
      <button onclick="setTutor('science')" class="shrink-0 bg-white border border-gray-200 hover:border-green-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🔬 Ciencias</button>
      <button onclick="setTutor('lang')" class="shrink-0 bg-white border border-gray-200 hover:border-yellow-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🌍 Lenguas</button>
      <button onclick="setTutor('history')" class="shrink-0 bg-white border border-gray-200 hover:border-orange-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🏛️ Historia</button>
      <button onclick="setTutor('code')" class="shrink-0 bg-white border border-gray-200 hover:border-purple-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">💻 Programación</button>
      <button onclick="generateFlashcardsQuick()" class="shrink-0 bg-orange-50 border border-orange-200 text-orange-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">⚡ Flashcards</button>
    </nav>

    <!-- MODAL CONFIGURACIÓN -->
    <div id="settings-modal" class="absolute inset-0 bg-gray-900/40 z-50 hidden flex justify-end">
      <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-lg">⚙️ Configuración Groq</h2>
          <button onclick="toggleSettings()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">🔐 API Key de Groq</label>
            <input type="password" id="api-key-display" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5" readonly value="••••••••••••••••••••">
            <button onclick="changeAPIKey()" class="mt-2 w-full bg-orange-600 hover:bg-orange-700 text-white rounded-lg py-2 text-xs font-bold">Cambiar API Key</button>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">🖼️ Replicate API Key (Imágenes Claras)</label>
            <input type="password" id="replicate-key-input" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5" placeholder="r8_...">
            <p class="text-xs text-gray-500 mt-1">Obtén gratis en <a href="https://replicate.com" target="_blank" class="text-orange-600 underline">replicate.com</a></p>
            <button onclick="saveReplicateKey()" class="mt-2 w-full bg-green-600 hover:bg-green-700 text-white rounded-lg py-2 text-xs font-bold">Guardar Replicate Key</button>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">🗣️ Voz de la IA</label>
            <select id="voice-selector" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5"></select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">⚡ Modelo Groq (Motor)</label>
            <select id="model-selector" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5" onchange="changeModel(this.value)">
              <option value="openai/gpt-oss-20b">GPT-OSS 20B (Ultra Rápido)</option>
              <option value="openai/gpt-oss-120b">GPT-OSS 120B (Máxima Inteligencia)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">🎚️ Creatividad (Temperatura: <span id="temp-val">0.3</span>)</label>
            <input type="range" id="temp-slider" min="0" max="1" step="0.1" value="0.3" class="w-full accent-orange-600" oninput="updateTemp(this.value)">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">📝 Instrucciones Base (Prompt)</label>
            <textarea id="custom-prompt" rows="5" class="w-full text-sm p-3 border border-gray-300 rounded-lg bg-gray-50 outline-none"></textarea>
            <button onclick="saveSettings()" class="mt-2 w-full bg-orange-600 hover:bg-orange-700 text-white rounded-lg py-2.5 text-sm font-bold">Guardar Prompt</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL GLOSARIO -->
    <div id="glossary-modal" class="absolute inset-0 bg-gray-900/50 z-50 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col max-h-[80vh] overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-base">📖 Glosario de Términos</h2>
          <button onclick="toggleGlossaryModal()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <div class="p-4 border-b bg-gray-50/50 flex gap-2">
          <input type="text" id="glossary-term-input" placeholder="Término..." class="flex-1 p-2 border rounded-lg text-xs outline-none">
          <input type="text" id="glossary-def-input" placeholder="Definición..." class="flex-1 p-2 border rounded-lg text-xs outline-none">
          <button onclick="addGlossaryItem()" class="bg-orange-600 text-white px-3 py-2 rounded-lg text-xs font-bold">+</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="glossary-list"></div>
      </div>
    </div>

    <!-- MODAL MEMORIA -->
    <div id="memory-modal" class="absolute inset-0 bg-gray-900/50 z-50 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col max-h-[80vh] overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-base">🧠 Base de Conocimiento Enriquecida</h2>
          <button onclick="toggleMemoryModal()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto space-y-3">
          <p class="text-xs text-gray-500">Información clave y extractos de documentos guardados:</p>
          <textarea id="memory-text-view" rows="8" class="w-full text-xs p-3 border rounded-xl bg-gray-50 outline-none" placeholder="Sin memoria activa aún..."></textarea>
          <button onclick="saveManualMemory()" class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-xl py-2 text-xs font-bold">Actualizar Memoria</button>
        </div>
      </div>
    </div>

    <!-- MODO LLAMADA -->
    <div id="call-modal" class="absolute inset-0 bg-gray-900/95 z-40 flex flex-col items-center justify-between p-6 md:p-12 hidden backdrop-blur-xl">
      <div class="w-full flex justify-end">
        <button onclick="toggleContinuousMode()" class="bg-gray-800 hover:bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold border border-gray-700">Finalizar</button>
      </div>
      <div class="flex flex-col items-center justify-center gap-6 my-auto">
        <div id="voice-orb" class="voice-orb w-40 h-40 rounded-full flex items-center justify-center cursor-pointer" onclick="triggerMicManual()">
          <span id="orb-status-icon" class="text-4xl">🎙️</span>
        </div>
        <p id="call-state-label" class="text-white/90 text-sm bg-black/30 px-4 py-1 rounded-full">Toca para hablar</p>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 bg-gray-50 pb-48"></div>

    <!-- ENTRADA -->
    <footer class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-10 pb-4 px-4 md:px-8 z-20 flex flex-col">
      <div class="max-w-4xl mx-auto w-full relative">
        <div id="attachment-chip" class="hidden absolute -top-8 left-2 bg-orange-100 text-orange-800 px-3 py-1 rounded-t-lg text-xs font-semibold flex items-center gap-2 border border-orange-200 border-b-0">
          📎 <span id="attachment-name" class="truncate max-w-[200px]">doc</span>
          <button onclick="removeAttachment()" class="text-red-500 ml-2">✖</button>
        </div>
        <div class="flex items-end gap-2 bg-white p-2 rounded-2xl border border-gray-300 shadow-lg focus-within:ring-2 ring-orange-100">
          <label for="file-upload" class="p-3 text-gray-400 hover:text-orange-600 cursor-pointer rounded-xl hover:bg-orange-50">📁</label>
          <input type="file" id="file-upload" class="hidden" accept=".txt,.pdf,.docx" onchange="handleFileUpload(event)">
          <textarea id="user-input" rows="1" placeholder="Pregunta algo..." class="flex-1 max-h-32 bg-transparent p-3 text-sm focus:outline-none resize-none"></textarea>
          <button onclick="triggerMicManual()" id="mic-btn" class="p-3 text-gray-400 hover:text-orange-500 rounded-xl">🎙️</button>
          <button onclick="sendMessage()" class="bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-xl shadow-sm">🚀</button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    let API_KEY = localStorage.getItem('groq_api_key') || "";
    let replicateApiKey = localStorage.getItem('replicate_api_key') || "";
    
    let currentModel = localStorage.getItem('groq_model') || "openai/gpt-oss-20b";
    let currentTemp = parseFloat(localStorage.getItem('groq_temp') || "0.3");

    const PROMPTS = {
      general: `Eres un asistente experto, conciso y ultrarrápido respaldado por los chips LPU de Groq. Si el usuario pide imágenes/infografías/diagramas, genera URLs usando: [IMAGE:descripcion_detallada_en_ingles]. Describe cada imagen con 3-5 palabras clave específicas.`,
      math: `Eres profesor de matemáticas nivel experto. Explica paso a paso con claridad. Para infografías usa: [IMAGE:diagrama_matematico_detallado].`,
      science: `Eres científico experto. Explica con analogías cotidianas. Para infografías usa: [IMAGE:diagrama_cientifico_realista_detallado].`,
      lang: `Eres un tutor de idiomas. Corrige sutilmente y da ejemplos claros.`,
      history: `Eres historiador. Cuenta los hechos con el contexto histórico exacto. Para infografías usa: [IMAGE:infografia_historica_detallada].`,
      code: `Eres Senior Developer. Escribe código limpio con comentarios y bloques Markdown.`
    };

    function showInitialSetup() {
      const setupModal = document.createElement('div');
      setupModal.id = 'setup-modal';
      setupModal.className = 'absolute inset-0 bg-gray-900/80 z-[999] flex items-center justify-center';
      setupModal.innerHTML = `
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
          <h2 class="text-2xl font-bold text-gray-800 mb-2">🔐 Configuración Inicial</h2>
          <p class="text-sm text-gray-600 mb-6">Ingresa tu clave de API de Groq para comenzar:</p>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2">API Key de Groq</label>
              <input type="password" id="api-key-input" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 ring-orange-500" placeholder="gsk_...">
              <p class="text-xs text-gray-500 mt-2">Obtén tu clave en: <a href="https://console.groq.com" target="_blank" class="text-orange-600 underline">console.groq.com</a></p>
            </div>
            <button onclick="saveAPIKey()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-lg font-bold text-sm transition-colors">Guardar y Continuar</button>
          </div>
        </div>
      `;
      document.body.appendChild(setupModal);
      document.getElementById('api-key-input').focus();
      document.getElementById('api-key-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveAPIKey();
      });
    }

    function saveAPIKey() {
      const apiKeyInput = document.getElementById('api-key-input');
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('⚠️ Por favor ingresa una clave de API válida.');
        return;
      }
      API_KEY = key;
      localStorage.setItem('groq_api_key', key);
      const setupModal = document.getElementById('setup-modal');
      if (setupModal) setupModal.remove();
      location.reload();
    }

    function checkStorageUsage() {
      try {
        let totalSize = Object.keys(localStorage).reduce((sum, key) => {
          return sum + localStorage.getItem(key).length;
        }, 0);
        const percentUsed = (totalSize / 5242880) * 100;
        if (percentUsed > 80) {
          console.warn(`⚠️ Almacenamiento al ${percentUsed.toFixed(1)}%. Considera hacer limpieza.`);
        }
      } catch(e) { console.warn('Error verificando almacenamiento:', e); }
    }

    function autoCleanOldChats() {
      if (!chats || Object.keys(chats).length < 50) return;
      let chatIds = Object.keys(chats).sort((a, b) => parseInt(b) - parseInt(a));
      if (chatIds.length > 50) {
        const toDelete = chatIds.slice(50);
        toDelete.forEach(id => delete chats[id]);
        saveChatsToStorage();
        console.warn(`🧹 Limpieza automática: ${toDelete.length} chats viejos eliminados.`);
      }
    }

    function showConnectionStatus() {
      const isOnline = navigator.onLine;
      const status = isOnline ? '✅ Online' : '⚠️ Offline';
      console.log(`Estado de conexión: ${status}`);
      if (!isOnline) {
        alert('⚠️ Sin conexión a internet. Algunos servicios no funcionarán.');
      }
    }

    window.addEventListener('online', showConnectionStatus);
    window.addEventListener('offline', showConnectionStatus);

    let currentUser = "Hosda", currentChatId = null, chats = {}; 
    let glossary = JSON.parse(localStorage.getItem('groq_glossary') || "[]");
    let audioEnabled = true, isContinuousMode = false, isRecording = false, isGenerating = false;
    let systemVoices = [], userSelectedVoiceName = localStorage.getItem('groq_voice') || "";
    let attachedFileText = "", attachedFileName = "";

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    window.onload = () => {
      if (!API_KEY) {
        showInitialSetup();
      } else {
        document.getElementById('model-selector').value = currentModel;
        document.getElementById('temp-slider').value = currentTemp;
        document.getElementById('temp-val').innerText = currentTemp;
        if (document.getElementById('replicate-key-input')) {
          document.getElementById('replicate-key-input').value = replicateApiKey ? '••••••••••••••••••••' : '';
        }
        if (localStorage.getItem('groq_dark') === 'true') {
          document.body.classList.add('dark');
          document.getElementById('theme-btn').innerText = "☀️";
        }
        loadUserChats();
        loadVoices();
        renderGlossary();
        checkStorageUsage();
        autoCleanOldChats();
        showConnectionStatus();
      }
    };

    function loadUserChats() {
      try {
        const saved = localStorage.getItem(`groq_chats_${currentUser}`);
        if (saved) { 
          chats = JSON.parse(saved); 
          const keys = Object.keys(chats);
          if(keys.length > 0) {
            loadChat(keys[keys.length - 1]);
            return;
          }
        }
      } catch(e) {}
      createNewChat();
    }

    function saveChatsToStorage() {
      try {
        const data = JSON.stringify(chats);
        if (data.length > 4500000) {
          alert('⚠️ Almacenamiento casi lleno. Por favor, elimina chats antiguos.');
          return;
        }
        localStorage.setItem(`groq_chats_${currentUser}`, data);
        renderSidebar();
      } catch (e) {
        console.error('Error guardando chats:', e);
        alert('❌ No se pudo guardar. Almacenamiento lleno.');
      }
    }
    
    function createNewChat(promptText = PROMPTS.general) {
      currentChatId = 'chat_' + Date.now();
      chats[currentChatId] = { title: "Nuevo Chat", prompt: promptText, memory: "", messages: [] };
      saveChatsToStorage(); loadChat(currentChatId);
    }

    function loadChat(id) {
      if(!chats[id]) return;
      currentChatId = id; chatBox.innerHTML = ''; removeAttachment();
      document.getElementById('custom-prompt').value = chats[id].prompt;
      document.getElementById('memory-text-view').value = chats[id].memory || "";
      if (chats[id].messages.length === 0) appendMessageToUI("¡Hola Hosda! Tutor conectado a Groq a velocidad máxima. ¿Qué estudiamos hoy?", false);
      else chats[id].messages.forEach(m => appendMessageToUI(m.content.split("--- CONTENIDO")[0], m.role === "user"));
      renderSidebar();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      if (Object.keys(chats).length <= 1) { alert("Conserva al menos una conversación."); return; }
      if (confirm("¿Eliminar este chat permanentemente?")) {
        delete chats[id]; saveChatsToStorage();
        const keys = Object.keys(chats);
        if (currentChatId === id) loadChat(keys[keys.length - 1]);
        else renderSidebar();
      }
    }

    function setTutor(subject) { createNewChat(PROMPTS[subject]); }
    
    function renderSidebar() {
      document.getElementById('history-list').innerHTML = Object.keys(chats).reverse().map(id => `
        <div class="flex items-center justify-between group rounded-lg ${id === currentChatId ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800'}">
          <button onclick="loadChat('${id}')" class="flex-1 text-left p-3 text-sm truncate">${chats[id].title}</button>
          <button onclick="deleteChat('${id}', event)" class="px-2.5 py-1 text-xs opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity" title="Eliminar">🗑️</button>
        </div>
      `).join('');
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('theme-btn').innerText = isDark ? "☀️" : "🌙";
      localStorage.setItem('groq_dark', isDark.toString());
    }

    function exportChatTXT() {
      if(!chats[currentChatId] || chats[currentChatId].messages.length === 0) return alert("Chat vacío.");
      const text = chats[currentChatId].messages.map(m => `${m.role.toUpperCase()}:\n${m.content}\n\n`).join("");
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `${chats[currentChatId].title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
      a.click();
    }

    function toggleGlossaryModal() { document.getElementById('glossary-modal').classList.toggle('hidden'); }
    function toggleMemoryModal() { document.getElementById('memory-modal').classList.toggle('hidden'); }
    
    function saveManualMemory() {
      chats[currentChatId].memory = document.getElementById('memory-text-view').value.trim();
      saveChatsToStorage();
      alert("¡Memoria actualizada con éxito!");
      toggleMemoryModal();
    }

    function addGlossaryItem() {
      const term = document.getElementById('glossary-term-input').value.trim();
      const def = document.getElementById('glossary-def-input').value.trim();
      if(!term || !def) return;
      glossary.push({ term, def });
      localStorage.setItem('groq_glossary', JSON.stringify(glossary));
      document.getElementById('glossary-term-input').value = '';
      document.getElementById('glossary-def-input').value = '';
      renderGlossary();
    }
    function deleteGlossaryItem(idx) {
      glossary.splice(idx, 1);
      localStorage.setItem('groq_glossary', JSON.stringify(glossary));
      renderGlossary();
    }
    function renderGlossary() {
      document.getElementById('glossary-list').innerHTML = glossary.map((item, i) => `
        <div class="p-3 bg-gray-50 border rounded-xl flex justify-between items-start text-xs">
          <div><strong class="text-orange-600">${item.term}:</strong> ${item.def}</div>
          <button onclick="deleteGlossaryItem(${i})" class="text-red-500 font-bold ml-2">×</button>
        </div>
      `).join('') || '<p class="text-xs text-gray-400 text-center py-4">Sin términos guardados.</p>';
    }

    function generateFlashcardsQuick() {
      userInput.value = "Genera 5 tarjetas rápidas (Flashcards) de preguntas y respuestas cortas basadas en nuestra memoria.";
      sendMessage();
    }

    function saveReplicateKey() {
      const key = prompt('Ingresa tu Replicate API Key (o déjalo vacío para usar pollinations.ai):', '').trim();
      if (key === '') {
        replicateApiKey = '';
        localStorage.removeItem('replicate_api_key');
        alert('Claves removidas. Se usará pollinations.ai');
        return;
      }
      replicateApiKey = key;
      localStorage.setItem('replicate_api_key', key);
      alert('✅ Replicate API Key guardada. Las imágenes tendrán mejor calidad.');
      document.getElementById('replicate-key-input').value = key ? '••••••••••••••••••••' : '';
      toggleSettings();
    }

    async function generateImageWithReplicate(prompt) {
      if (!replicateApiKey) return null;
      try {
        const res = await fetch('https://api.replicate.com/v1/predictions', {
          method: 'POST',
          headers: {
            'Authorization': `Token ${replicateApiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            version: '2e191859266f726216beec79f53f7fc3a6d3512c7cda285dd5ce542eaf389c18',
            input: { prompt }
          })
        });

        if (!res.ok) {
          console.warn('Error Replicate:', await res.text());
          return null;
        }

        let prediction = await res.json();
        let attempts = 0;
        while (prediction.status === 'processing' && attempts < 30) {
          await new Promise(r => setTimeout(r, 1000));
          const checkRes = await fetch(`https://api.replicate.com/v1/predictions/${prediction.id}`, {
            headers: { 'Authorization': `Token ${replicateApiKey}` }
          });
          prediction = await checkRes.json();
          attempts++;
        }

        if (prediction.status === 'succeeded' && prediction.output) {
          return prediction.output[0] || prediction.output;
        }
        return null;
      } catch(e) {
        console.warn('Error generando imagen:', e);
        return null;
      }
    }

    function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }
    function updateTemp(val) { currentTemp = parseFloat(val); document.getElementById('temp-val').innerText = val; localStorage.setItem('groq_temp', currentTemp); }
    function saveSettings() {
      chats[currentChatId].prompt = document.getElementById('custom-prompt').value.trim();
      saveChatsToStorage(); toggleSettings();
    }
    function changeAPIKey() {
      const newKey = prompt('Ingresa tu nueva API Key de Groq (o déjalo vacío para cancelar):', '').trim();
      if (newKey === '') return;
      if (!newKey) {
        alert('⚠️ API Key no puede estar vacía.');
        return;
      }
      API_KEY = newKey;
      localStorage.setItem('groq_api_key', newKey);
      alert('✅ API Key actualizada exitosamente.');
      toggleSettings();
    }
    function changeModel(val) { currentModel = val; localStorage.setItem('groq_model', currentModel); }

    async function handleFileUpload(e) {
      const file = e.target.files[0]; 
      if (!file) return;
      
      if (file.size > 10485760) {
        alert('❌ Archivo muy grande. Máximo 10MB.');
        e.target.value = '';
        return;
      }
      
      const validTypes = ['text/plain', 'application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
      if (!validTypes.includes(file.type)) {
        alert('❌ Tipo de archivo no permitido. Solo .txt, .pdf, .docx');
        e.target.value = '';
        return;
      }
      
      document.getElementById('attachment-chip').classList.remove('hidden');
      document.getElementById('attachment-name').innerText = "Leyendo archivo...";
      try {
        let text = "";
        if (file.name.endsWith('.pdf')) {
          const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(it => it.str).join(" ") + " ";
        } else if (file.name.endsWith('.docx')) text = (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
        else text = await file.text();
        
        attachedFileText = text.substring(0, 15000); 
        attachedFileName = file.name;
        document.getElementById('attachment-name').innerText = file.name;
        
        if(!chats[currentChatId].memory) chats[currentChatId].memory = "";
        chats[currentChatId].memory += `\n[Documento aportado: ${file.name}]\n${attachedFileText.substring(0, 1000)}...\n`;
        document.getElementById('memory-text-view').value = chats[currentChatId].memory;
        saveChatsToStorage();

      } catch (err) { alert("Error al leer archivo"); removeAttachment(); }
      e.target.value = '';
    }
    function removeAttachment() { attachedFileText = attachedFileName = ""; document.getElementById('attachment-chip').classList.add('hidden'); }

    let audioQueue = [], isPlayingAudio = false, audioBufferText = "";
    function loadVoices() {
      try {
        let voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('es'));
        systemVoices = voices;
        const sel = document.getElementById('voice-selector'); sel.innerHTML = '';
        systemVoices.forEach(v => sel.add(new Option(v.name.split('-')[0], v.name)));
        if(systemVoices.length) sel.value = systemVoices.some(v=>v.name===userSelectedVoiceName) ? userSelectedVoiceName : systemVoices[0].name;
      } catch(e) { console.warn('Error cargando voces:', e); }
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    document.getElementById('voice-selector').onchange = (e) => localStorage.setItem('groq_voice', (userSelectedVoiceName = e.target.value));
    function toggleAudio() { audioEnabled = !audioEnabled; document.getElementById('audio-icon').innerText = audioEnabled ? "🔊" : "🔇"; window.speechSynthesis.cancel(); }

    function processAudioStream(chunk) {
      try {
        if (!audioEnabled || !('speechSynthesis' in window) || !chunk) return;
        audioBufferText += chunk;
        let match = audioBufferText.match(/([^.?!]+[.?!]+[\s]*)/);
        if (match) {
          let sentence = match[0];
          audioBufferText = audioBufferText.substring(sentence.length);
          if(!sentence.includes("pollinations") && !sentence.includes("![Img") && !sentence.includes("```")) {
            audioQueue.push(sentence); playNextAudio();
          }
        }
      } catch(e) { console.warn('Error procesando audio:', e); }
    }

    function playNextAudio() {
      try {
        if (isPlayingAudio || audioQueue.length === 0) return;
        isPlayingAudio = true;
        let text = audioQueue.shift();
        let utterance = new SpeechSynthesisUtterance(text.replace(/[*#_`~[\]]/g, ''));
        let voice = systemVoices.find(v => v.name === document.getElementById('voice-selector').value);
        if (voice) utterance.voice = voice;
        
        const orb = document.getElementById('voice-orb');
        if(orb) orb.className = "voice-orb speaking w-40 h-40 rounded-full flex items-center justify-center cursor-pointer";
        
        utterance.onerror = (e) => {
          console.warn('Error de síntesis:', e.error);
          isPlayingAudio = false;
          playNextAudio();
        };
        
        utterance.onend = () => {
          isPlayingAudio = false;
          if (audioQueue.length > 0) playNextAudio();
          else {
            if(orb) orb.className = "voice-orb w-40 h-40 rounded-full flex items-center justify-center cursor-pointer";
            if (!isGenerating && isContinuousMode) setTimeout(startListening, 300);
          }
        };
        window.speechSynthesis.speak(utterance);
      } catch(e) { console.warn('Error reproduciendo audio:', e); isPlayingAudio = false; playNextAudio(); }
    }

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = Recognition ? new Recognition() : null;
    if (recognition) {
      recognition.lang = 'es-ES'; 
      recognition.interimResults = false;
      recognition.onresult = (e) => { 
        userInput.value = Array.from(e.results).map(r => r[0].transcript).join(''); 
      };
      recognition.onerror = (e) => {
        console.error('Error de voz:', e.error);
        stopMicUI();
      };
      recognition.onend = () => { 
        stopMicUI(); 
        if (userInput.value.trim() !== "") sendMessage(); 
      };
    }
    function startListening() {
      if (!recognition) return alert('Navegador sin soporte de voz.');
      window.speechSynthesis.cancel(); audioQueue = []; audioBufferText = "";
      userInput.value = ''; recognition.start(); isRecording = true;
      document.getElementById('voice-orb').className = "voice-orb listening w-40 h-40 rounded-full flex items-center justify-center cursor-pointer";
    }
    function stopMicUI() {
      isRecording = false;
      const orb = document.getElementById('voice-orb');
      if(orb) orb.className = "voice-orb w-40 h-40 rounded-full flex items-center justify-center cursor-pointer";
    }
    function triggerMicManual() { if (isRecording) recognition.stop(); else startListening(); }
    function toggleContinuousMode() {
      isContinuousMode = !isContinuousMode;
      document.getElementById('call-modal').classList.toggle('hidden', !isContinuousMode);
      if (isContinuousMode) startListening(); else { if (isRecording) recognition.stop(); window.speechSynthesis.cancel(); }
    }

    function appendMessageToUI(content, isUser) {
      const div = document.createElement('div');
      div.className = `flex flex-col max-w-3xl mx-auto w-full mb-4 ${isUser ? 'items-end' : 'items-start'}`;
      div.setAttribute('aria-label', `Mensaje de ${isUser ? 'usuario' : 'asistente'}`);
      const msg = document.createElement('div');
      msg.className = `prose prose-sm p-4 rounded-2xl max-w-[90%] shadow-sm overflow-x-auto ${isUser ? 'bg-orange-600 text-white rounded-tr-none' : 'bg-white border border-gray-200 text-gray-800 rounded-tl-none'}`;
      if (isUser) {
        msg.innerHTML = content;
      } else {
        try {
          const cleanContent = content.replace(/<script|<iframe|javascript:/gi, '');
          let html = marked.parse(cleanContent);
          
          // Procesar tags [IMAGE:descripción]
          const imageRegex = /\[IMAGE:([^\]]+)\]/g;
          html = html.replace(imageRegex, (match, desc) => {
            const safeDesc = desc.replace(/"/g, '&quot;').trim();
            return `<div class="image-placeholder" data-prompt="${safeDesc}" style="background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; padding: 20px; text-align: center; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px;">⏳ Generando imagen: "${safeDesc}"...</div>`;
          });
          
          msg.innerHTML = html;
          
          // Procesar imágenes pendientes
          const imagePlaceholders = msg.querySelectorAll('.image-placeholder');
          imagePlaceholders.forEach((ph) => {
            const prompt = ph.getAttribute('data-prompt');
            if (prompt) {
              processImageGeneration(ph, prompt);
            }
          });
        } catch(e) {
          msg.innerHTML = content;
        }
      }
      div.appendChild(msg); 
      chatBox.appendChild(div);
      Prism.highlightAllUnder(msg); 
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    async function processImageGeneration(placeholder, prompt) {
      try {
        let imageUrl = null;
        
        // Intentar con Replicate primero
        if (replicateApiKey) {
          imageUrl = await generateImageWithReplicate(prompt);
        }
        
        // Si no hay Replicate o falla, usar pollinations.ai
        if (!imageUrl) {
          imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
        }
        
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = prompt;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '500px';
        img.style.objectFit = 'contain';
        img.style.borderRadius = '8px';
        
        img.onerror = () => {
          placeholder.innerHTML = `<div style="color: #d32f2f; font-size: 14px;">❌ Error generando imagen: "${prompt}"</div>`;
        };
        
        img.onload = () => {
          placeholder.replaceWith(img);
          chatBox.scrollTop = chatBox.scrollHeight;
        };
        
      } catch(e) {
        console.error('Error en processImageGeneration:', e);
        placeholder.innerHTML = `<div style="color: #d32f2f; font-size: 14px;">❌ Error: ${e.message}</div>`;
      }
    }

    async function sendMessage() {
      if (!API_KEY) {
        alert('⚠️ API Key no configurada. Recarga la página para ingresarla.');
        return;
      }
      
      let rawInput = userInput.value.trim();
      if (!rawInput && !attachedFileText) return;
      
      if (rawInput.length > 5000) {
        alert('⚠️ Mensaje muy largo. Máximo 5000 caracteres.');
        return;
      }
      
      if (chats[currentChatId].memory.length > 50000) {
        alert('⚠️ Memoria muy grande. Borra algunos datos o crea un nuevo chat.');
        return;
      }
      
      isGenerating = true; 
      window.speechSynthesis.cancel(); 
      audioQueue = []; 
      audioBufferText = "";
      
      let apiText = rawInput;
      let uiText = rawInput;
      if (attachedFileText) {
        apiText += `\n--- CONTENIDO ARCHIVO SUBIDO ---\n${attachedFileText}`;
        uiText += `<br><span class='text-xs text-orange-500'>📎 ${attachedFileName} (Guardado en Memoria)</span>`;
      }

      if (!chats[currentChatId].messages.length) chats[currentChatId].title = (rawInput.substring(0, 20) || attachedFileName) + "...";
      appendMessageToUI(uiText, true);
      chats[currentChatId].messages.push({ role: "user", content: apiText });
      
      if (rawInput.length > 30 && (rawInput.toLowerCase().includes("guarda") || rawInput.toLowerCase().includes("aprende") || rawInput.toLowerCase().includes("nota") || rawInput.toLowerCase().includes("es:"))) {
        chats[currentChatId].memory += `\n[Dato clave aportado]: ${rawInput}`;
        document.getElementById('memory-text-view').value = chats[currentChatId].memory;
      }

      userInput.value = '';
      removeAttachment(); 
      saveChatsToStorage();
      
      const aiDiv = appendMessageToUI('<span class="animate-pulse">Pensando a velocidad Groq...</span>', false);
      let fullReply = "";

      try {
        let systemContent = chats[currentChatId].prompt;
        if(chats[currentChatId].memory) {
          systemContent += `\n\n[BASE DE CONOCIMIENTO Y MEMORIA]:\n${chats[currentChatId].memory}`;
        }

        const targetUrl = "https://api.groq.com/openai/v1/chat/completions";
        
        const res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${API_KEY}`, 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            model: currentModel, 
            temperature: currentTemp,
            messages: [{role: "system", content: systemContent}, ...chats[currentChatId].messages], 
            stream: true 
          })
        });

        if (!res.ok) {
           let errorData;
           try { errorData = await res.json(); } catch(e) { errorData = { error: { message: `Código HTTP ${res.status}` } }; }
           throw new Error(errorData.error?.message || `Código HTTP ${res.status}`);
        }

        aiDiv.innerHTML = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunks = decoder.decode(value).split("\n");
          for (const chunk of chunks) {
            if (chunk.startsWith("data: ") && !chunk.includes("[DONE]")) {
              try {
                let parsed = JSON.parse(chunk.slice(6));
                let textChunk = parsed.choices[0]?.delta?.content || "";
                if (textChunk) {
                    fullReply += textChunk;
                    aiDiv.innerHTML = marked.parse(fullReply);
                    Prism.highlightAllUnder(aiDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                    processAudioStream(textChunk); 
                }
              } catch(e) {}
            }
          }
        }
        
        if (audioBufferText.trim().length > 0) {
           audioQueue.push(audioBufferText);
           playNextAudio();
        }
        
        chats[currentChatId].messages.push({ role: "assistant", content: fullReply });
        saveChatsToStorage();

      } catch (err) { 
        console.error('Error de API:', err);
        let errorMsg = err.message;
        if (err.message.includes('405')) {
          errorMsg = 'Error 405: Verifica que la API Key sea válida y el endpoint sea correcto.';
        } else if (err.message.includes('401')) {
          errorMsg = 'Error 401: API Key inválida o expirada.';
        } else if (err.message.includes('429')) {
          errorMsg = 'Error 429: Demasiadas solicitudes. Intenta en unos segundos.';
        }
        aiDiv.innerHTML = `<div class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs">
          <strong>⚠️ Error:</strong> ${errorMsg}
        </div>`; 
        if (chats[currentChatId].messages.length > 0) {
          chats[currentChatId].messages.pop();
        }
      }
      
      isGenerating = false;
      if (isContinuousMode && audioQueue.length === 0) setTimeout(startListening, 500);
    }

    userInput.onkeypress = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  </script>
