<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 Tutor IA Studio Pro + Groq</title>
  <meta name="description" content="La IA educativa más rápida - Impulsada por Groq LPU Chips">
  
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    @keyframes pulse-orb {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 25px rgba(14, 165, 233, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
    }
    .voice-orb { background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7, #0369a1); animation: pulse-orb 2s infinite ease-in-out; }
    .voice-orb.speaking { background: radial-gradient(circle at 30% 30%, #4ade80, #22c55e, #15803d); animation: pulse-orb 0.8s infinite ease-in-out; }
    .voice-orb.listening { background: radial-gradient(circle at 30% 30%, #f43f5e, #e11d48, #9f1239); animation: pulse-orb 1.2s infinite ease-in-out; }
    .prose img { border-radius: 12px; margin-top: 10px; width: 100%; max-width: 800px; height: auto; object-fit: contain; display: block; margin-left: auto; margin-right: auto; }
    .prose pre { background: #1d1f21 !important; border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body.dark { background-color: #0f172a; color: #f1f5f9; }
    .dark .bg-white { background-color: #1e293b; color: #f1f5f9; }
    .dark .bg-gray-50 { background-color: #0f172a; }
    .dark .text-gray-800 { color: #f8fafc; }
    .dark .border-gray-200 { border-color: #334155; }
    .dark .prose { color: #e2e8f0; }
    .dark footer { background: linear-gradient(to top, #0f172a, rgba(15, 23, 42, 0.9), transparent) !important; }
    .prose img { background: white; padding: 8px; border: 1px solid #e2e8f0; }
    .dark .prose img { background: #1e293b; border-color: #334155; }
    .status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .status-online { background: #22c55e; }
    .status-offline { background: #ef4444; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-full flex font-sans overflow-hidden transition-colors duration-300">

  <!-- BARRA LATERAL -->
  <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex shrink-0 z-40">
    <div class="p-4 border-b border-gray-800">
      <div class="flex items-center gap-2 mb-4 px-2">
        <span class="inline-block w-2 h-2 rounded-full status-indicator status-online" id="status-dot"></span>
        <span id="user-display-name" class="font-medium text-sm truncate">Hosda</span>
      </div>
      <button onclick="createNewChat()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 px-4 rounded-xl flex justify-center gap-2 text-sm font-bold mb-2">+ Nuevo Chat</button>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-1" id="history-list"></div>
    <div class="p-4 border-t border-gray-800 space-y-2">
      <button onclick="toggleGlossaryModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-xl text-xs font-semibold">📖 Glosario</button>
      <button onclick="toggleMemoryModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-xl text-xs font-semibold">🧠 Memoria</button>
      <button onclick="toggleWebSearchModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-xl text-xs font-semibold">🔍 Búsqueda Web</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 flex flex-col h-full relative bg-white">
    
    <header class="h-14 border-b border-gray-200 flex items-center justify-between px-4 shadow-sm z-10 bg-white">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <h1 class="font-bold text-gray-700 text-sm hidden sm:block">Tutor IA Groq Studio Pro v1.0</h1>
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <button onclick="exportChat()" class="text-gray-500 hover:text-green-600 transition-colors text-xs font-medium px-2 py-1 rounded bg-gray-100">📥 Exportar</button>
        <button onclick="toggleTheme()" id="theme-btn" class="text-gray-500 hover:text-yellow-500 transition-colors text-sm font-medium">🌙</button>
        <button onclick="toggleContinuousMode()" id="continuous-btn" class="text-gray-400 hover:text-green-600 transition-all text-sm font-medium">📞 Llamada</button>
        <button onclick="toggleAudio()" class="text-gray-500 hover:text-orange-600 transition-colors text-sm font-medium"><span id="audio-icon">🔊</span></button>
        <button onclick="toggleSettings()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-semibold">⚙️ Ajustes</button>
      </div>
    </header>

    <!-- BIBLIOTECA -->
    <nav class="border-b border-gray-100 bg-gray-50 p-2 flex overflow-x-auto no-scrollbar gap-2 z-10 shadow-inner">
      <span class="text-xs font-bold text-gray-400 py-1.5 px-2 uppercase tracking-wider shrink-0">Especialidades:</span>
      <button onclick="setTutor('math')" class="shrink-0 bg-white border border-gray-200 hover:border-orange-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">📐 Matemáticas</button>
      <button onclick="setTutor('science')" class="shrink-0 bg-white border border-gray-200 hover:border-green-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🔬 Ciencias</button>
      <button onclick="setTutor('lang')" class="shrink-0 bg-white border border-gray-200 hover:border-yellow-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🌍 Idiomas</button>
      <button onclick="setTutor('history')" class="shrink-0 bg-white border border-gray-200 hover:border-blue-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">🏛️ Historia</button>
      <button onclick="setTutor('code')" class="shrink-0 bg-white border border-gray-200 hover:border-purple-400 text-gray-700 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">💻 Código</button>
      <button onclick="generateFlashcards()" class="shrink-0 bg-orange-50 border border-orange-200 text-orange-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">⚡ Flashcards</button>
    </nav>

    <!-- MODAL CONFIGURACIÓN -->
    <div id="settings-modal" class="absolute inset-0 bg-gray-900/40 z-50 hidden flex justify-end">
      <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-lg">⚙️ Configuración</h2>
          <button onclick="toggleSettings()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto space-y-6">
          <div>
            <p class="text-xs text-gray-500 mb-2">🚀 Backend Status: <span id="backend-status" class="text-yellow-600">Verificando...</span></p>
            <label class="block text-sm font-bold text-gray-700 mb-2">🎚️ Temperatura (Creatividad)</label>
            <div class="flex gap-2">
              <input type="range" id="temp-slider" min="0" max="1" step="0.1" value="0.3" class="flex-1 accent-orange-600" oninput="updateTemp(this.value)">
              <span id="temp-val" class="text-sm font-bold text-orange-600">0.3</span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">🗣️ Voz de Síntesis</label>
            <select id="voice-selector" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5"></select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">📝 Prompt Base (Personalizado)</label>
            <textarea id="custom-prompt" rows="4" class="w-full text-sm p-3 border border-gray-300 rounded-lg bg-gray-50 outline-none"></textarea>
            <button onclick="saveCustomPrompt()" class="mt-2 w-full bg-orange-600 hover:bg-orange-700 text-white rounded-lg py-2 text-xs font-bold">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL BÚSQUEDA WEB -->
    <div id="web-search-modal" class="absolute inset-0 bg-gray-900/50 z-50 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[80vh] overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-base">🔍 Búsqueda Web Integrada</h2>
          <button onclick="toggleWebSearchModal()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <div class="p-4 border-b flex gap-2">
          <input type="text" id="web-search-input" placeholder="Buscar en internet..." class="flex-1 p-2 border rounded-lg text-sm outline-none">
          <button onclick="performWebSearch()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Buscar</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="search-results"></div>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 bg-gray-50 pb-48"></div>

    <!-- ENTRADA -->
    <footer class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-10 pb-4 px-4 md:px-8 z-20 flex flex-col">
      <div class="max-w-4xl mx-auto w-full relative">
        <div id="attachment-chip" class="hidden absolute -top-8 left-2 bg-orange-100 text-orange-800 px-3 py-1 rounded-t-lg text-xs font-semibold flex items-center gap-2 border border-orange-200 border-b-0">
          📎 <span id="attachment-name" class="truncate max-w-[200px]">doc</span>
          <button onclick="removeAttachment()" class="text-red-500 ml-2">✖</button>
        </div>
        <div class="flex items-end gap-2 bg-white p-2 rounded-2xl border border-gray-300 shadow-lg focus-within:ring-2 ring-orange-100">
          <label for="file-upload" class="p-3 text-gray-400 hover:text-orange-600 cursor-pointer rounded-xl hover:bg-orange-50">📁</label>
          <input type="file" id="file-upload" class="hidden" accept=".txt,.pdf,.docx" onchange="handleFileUpload(event)">
          <textarea id="user-input" rows="1" placeholder="Pregunta algo..." class="flex-1 max-h-32 bg-transparent p-3 text-sm focus:outline-none resize-none"></textarea>
          <button onclick="triggerMic()" id="mic-btn" class="p-3 text-gray-400 hover:text-orange-500 rounded-xl">🎙️</button>
          <button onclick="sendMessage()" class="bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-xl shadow-sm">🚀</button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const API_KEY = localStorage.getItem('groq_api_key') || "";
    const currentModel = localStorage.getItem('groq_model') || "mixtral-8x7b-32768";
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    const PROMPTS = {
      general: `Eres un asistente educativo experto impulsado por Groq. Sé conciso pero completo. Usa Markdown para structures. Si alguien pregunta sobre búsqueda web, di: "Los resultados están disponibles - puedes acceder a información en tiempo real."`,
      math: `Eres profesor de Matemáticas experto. Explica paso a paso. Usa ecuaciones cuando sea necesario. Sé muy claro.`,
      science: `Eres científico. Explica conceptos con ejemplos reales. Usa diagramas cuando sea posible. Cita fuentes cuando sea apropiado.`,
      lang: `Eres tutor de Idiomas. Corrige amablemente. Da ejemplos auténticos. Explica pronunciación cuando sea necesario.`,
      history: `Eres historiador. Contextualiza hechos históricos. Menciona múltiples perspectivas. Sé imparcial y preciso.`,
      code: `Eres Senior Developer. Escribe código limpio y seguro. Comenta tu código. Explica conceptos avanzados cuando sea necesario.`
    };

    let currentChatId = null;
    let chats = {};
    let isGenerating = false;
    let audioEnabled = true;

    function loadChats() {
      try {
        const saved = localStorage.getItem('tutor_chats');
        if (saved) chats = JSON.parse(saved);
        const keys = Object.keys(chats);
        if (keys.length > 0) loadChat(keys[keys.length - 1]);
        else createNewChat();
      } catch (e) { createNewChat(); }
    }

    function createNewChat(type = 'general') {
      currentChatId = 'chat_' + Date.now();
      chats[currentChatId] = {
        title: "Nuevo Chat",
        type: type,
        messages: [],
        createdAt: new Date().toISOString()
      };
      saveChats();
      loadChat(currentChatId);
    }

    function loadChat(id) {
      if (!chats[id]) return;
      currentChatId = id;
      chatBox.innerHTML = '';
      document.getElementById('custom-prompt').value = PROMPTS[chats[id].type] || PROMPTS.general;
      chats[id].messages.forEach(m => appendMessage(m.content, m.role === 'user'));
      renderHistory();
    }

    function saveChats() {
      localStorage.setItem('tutor_chats', JSON.stringify(chats));
      renderHistory();
    }

    function renderHistory() {
      document.getElementById('history-list').innerHTML = Object.keys(chats).reverse().map(id => `
        <div class="flex items-center justify-between group rounded-lg p-2 ${id === currentChatId ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800'}">
          <button onclick="loadChat('${id}')" class="flex-1 text-left text-sm truncate">${chats[id].title}</button>
          <button onclick="deleteChat('${id}', event)" class="text-xs opacity-0 group-hover:opacity-100 hover:text-red-400">🗑️</button>
        </div>
      `).join('');
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      if (confirm('¿Eliminar este chat?')) {
        delete chats[id];
        saveChats();
        if (currentChatId === id) createNewChat();
      }
    }

    function setTutor(type) { createNewChat(type); }

    function appendMessage(content, isUser) {
      const div = document.createElement('div');
      div.className = `flex max-w-3xl mx-auto w-full mb-4 ${isUser ? 'justify-end' : 'justify-start'}`;
      const msg = document.createElement('div');
      msg.className = `prose prose-sm p-4 rounded-2xl max-w-[90%] ${isUser ? 'bg-orange-600 text-white rounded-tr-none' : 'bg-white border border-gray-200 rounded-tl-none'}`;
      if (!isUser) {
        msg.innerHTML = marked.parse(content);
        Prism.highlightAllUnder(msg);
      } else {
        msg.textContent = content;
      }
      div.appendChild(msg);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      if (!API_KEY) { alert('API Key no configurada'); return; }
      const text = userInput.value.trim();
      if (!text) return;

      isGenerating = true;
      appendMessage(text, true);
      chats[currentChatId].messages.push({ role: 'user', content: text });
      userInput.value = '';

      const aiMsg = appendMessage('🤔 Thinking...', false);
      let fullReply = '';

      try {
        const res = await fetch(API_KEY.startsWith('http') ? API_KEY : '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: PROMPTS[chats[currentChatId].type] || PROMPTS.general },
              ...chats[currentChatId].messages
            ],
            model: currentModel,
            temperature: parseFloat(localStorage.getItem('groq_temp') || '0.3')
          })
        });

        if (!res.ok) throw new Error(`Error: ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        aiMsg.innerHTML = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const text = decoder.decode(value);
          const lines = text.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                const chunk = data.choices?.[0]?.delta?.content || '';
                if (chunk) {
                  fullReply += chunk;
                  aiMsg.innerHTML = marked.parse(fullReply);
                  chatBox.scrollTop = chatBox.scrollHeight;
                }
              } catch (e) { }
            }
          }
        }

        chats[currentChatId].messages.push({ role: 'assistant', content: fullReply });
        saveChats();
      } catch (err) {
        aiMsg.innerHTML = `<span class="text-red-600">❌ Error: ${err.message}</span>`;
      }
      isGenerating = false;
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      localStorage.setItem('tutor_dark', document.body.classList.contains('dark'));
      document.getElementById('theme-btn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }

    function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }
    function toggleWebSearchModal() { document.getElementById('web-search-modal').classList.toggle('hidden'); }
    function toggleContinuousMode() { alert('Modo Llamada próximamente'); }
    function toggleAudio() { audioEnabled = !audioEnabled; document.getElementById('audio-icon').textContent = audioEnabled ? '🔊' : '🔇'; }
    function triggerMic() { alert('Voz próximamente'); }
    function updateTemp(val) { localStorage.setItem('groq_temp', val); document.getElementById('temp-val').textContent = val; }
    function saveCustomPrompt() { alert('Prompt guardado'); }
    function generateFlashcards() { userInput.value = 'Genera 5 flashcards sobre el tema anterior'; sendMessage(); }
    function exportChat() { const data = JSON.stringify(chats[currentChatId], null, 2); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `chat_${Date.now()}.json`; a.click(); }
    function removeAttachment() { document.getElementById('attachment-chip').classList.add('hidden'); }
    async function handleFileUpload(e) { alert('Carga de archivos próximamente'); }
    async function performWebSearch() { const query = document.getElementById('web-search-input').value; const res = await fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) }); const data = await res.json(); document.getElementById('search-results').innerHTML = data.results.map(r => `<div class="p-3 bg-gray-50 border rounded-lg"><strong>${r.title}</strong><p class="text-xs text-gray-600 mt-1">${r.snippet}</p><a href="${r.url}" target="_blank" class="text-xs text-orange-600 hover:underline">Ver más →</a></div>`).join(''); }

    // Inicializar
    window.onload = () => {
      if (localStorage.getItem('tutor_dark') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('theme-btn').textContent = '☀️';
      }
      loadChats();
      
      // Verificar backend
      fetch('/api/health').then(r => r.json()).then(d => {
        document.getElementById('backend-status').textContent = '✅ Conectado';
        document.getElementById('backend-status').className = 'text-green-600';
      }).catch(() => {
        document.getElementById('backend-status').textContent = '⚠️ Sin Backend';
      });
    };

    userInput.onkeypress = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    
    // Monitorear conexión
    window.addEventListener('online', () => { document.getElementById('status-dot').classList.remove('status-offline'); document.getElementById('status-dot').classList.add('status-online'); });
    window.addEventListener('offline', () => { document.getElementById('status-dot').classList.remove('status-online'); document.getElementById('status-dot').classList.add('status-offline'); });
  </script>
</body>
</html>
